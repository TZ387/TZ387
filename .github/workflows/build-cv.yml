name: Build CV

on:
  push:
    branches: [main]
    paths:
      - "cv/**"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v5

      - name: Compile CV
        run: typst compile cv/main.typ tilen-zel-cv.pdf

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tilen-zel-cv.pdf
          git diff --staged --quiet || git commit -m "Update tilen-zel-cv.pdf from Typst source"
          git push
